<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <meta name="keywords" content="{{ site.keywords }}">
  <link rel="canonical" href="{{ site.url }}/">
  <link rel="icon" href="{{ '/assets/img/favicon.png' | relative_url }}" media="(prefers-color-scheme: light)">
  <link rel="icon" href="{{ '/assets/img/favicon-dark.png' | relative_url }}" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <main class="page">
{{ content }}
  </main>
</body>
</html>
